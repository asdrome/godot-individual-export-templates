name: Deploy to GitHub Pages

on:
  push:
    branches: ['webpage'] # Deployment branch

defaults:
  run:
    working-directory: ./godot-indv-tmpl-bundler

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bun
      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        
        run: bun install

      - name: build
        env:
          # asdrome.github.io/godot-individual-export-templates
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: bun run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Full path
          path: 'godot-indv-tmpl-bundler/build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4